name: Test WASM Compatibility
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test-wasm:
    strategy:
      fail-fast: false
      matrix:
        rust-version:
          - "1.82.0"
          - "1.84.0"
          - "1.85.0"
          - "1.86.0"
          - "1.88.0"
          - "1.90.0"
          - "stable"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust-version }}
          targets: wasm32-wasip2

      - name: Install wasm-tools
        run: cargo install wasm-tools --locked

      - name: Build WASM
        run: cargo build --release --target wasm32-wasip2

      - name: Rename output
        run: cp target/wasm32-wasip2/release/lammps_zed.wasm extension-${{ matrix.rust-version }}.wasm

      - name: Validate WASM component
        run: |
          wasm-tools validate extension-${{ matrix.rust-version }}.wasm
          echo "Validate passed for Rust ${{ matrix.rust-version }}"

      - name: Show WASM info
        run: |
          echo "=== Header ==="
          xxd extension-${{ matrix.rust-version }}.wasm | head -3
          echo "=== Size ==="
          wc -c extension-${{ matrix.rust-version }}.wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-rust-${{ matrix.rust-version }}
          path: extension-${{ matrix.rust-version }}.wasm
