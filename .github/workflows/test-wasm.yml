name: Test WASM Compatibility
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test-wasm:
    strategy:
      fail-fast: false
      matrix:
        rust-version:
          - "1.86.0"
          - "1.88.0"
          - "1.90.0"
          - "stable"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust-version }}
          targets: wasm32-wasip2

      - name: Build WASM
        run: cargo build --release --target wasm32-wasip2

      - name: Check output
        run: |
          cp target/wasm32-wasip2/release/lammps_zed.wasm extension-${{ matrix.rust-version }}.wasm
          echo "=== Header ==="
          xxd extension-${{ matrix.rust-version }}.wasm | head -3
          echo "=== Size ==="
          wc -c extension-${{ matrix.rust-version }}.wasm
          echo "=== Is Component? ==="
          head -c 8 extension-${{ matrix.rust-version }}.wasm | xxd -p

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-rust-${{ matrix.rust-version }}
          path: extension-${{ matrix.rust-version }}.wasm
